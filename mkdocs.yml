site_name: Umesh Khatiwada · Blog
site_author: Umesh Khatiwada
site_description: Field-tested DevOps, platform engineering and AI automation guides by Umesh Khatiwada.
site_url: https://blog.umeshkhatiwada.com.np

repo_url: https://github.com/umesh-khatiwada/DevOpsDocs
repo_name: umesh-khatiwada/DevOpsDocs
edit_uri: edit/main/docs/

copyright: >
  © 2026 <a href="https://umeshkhatiwada.com.np">Umesh Khatiwada</a> ·
  DevOps, Platform &amp; AI Automation Engineer in Kathmandu, Nepal

nav:
  - Home: index.md
  - Monitoring:
    - Prometheus & Grafana: Monitoring/1. setup_prometheus-grafana.md
    - Google Chat alerts: Monitoring/2. gmail_integration.md
    - Slack alerts: Monitoring/3. slack_integration.md
  - Logging:
    - Kafka: Logging/kafka.md
  - Security:
    - Kubescape: Security/KubeScape.md
    - M9Sweeper: Security/M9Sweeper.md
    - Signed images (Kaniko, Cosign, Kyverno): Platform/docker-image-security.md
  - Platform:
    - KEDA autoscaling: Platform/keda.md
    - Traefik: Traefik/Traefik.md
    - Karmada multi-cluster: MultiCluster/Karmada.md
    - Kasten backup & restore: Backup&Restore/kasten.md
    - "Fix: expired Contour certs": Troubleshoots/How to rotate and renew expired Contou.md
  - Agentic AI:
    - Agentic AI: AgenticAI/agentic-ai.md
    - Introduction to MCP: AgenticAI/introduction-to-mcp.md
    - CAI cybersecurity agent: AgenticAI/cai-cybersecurity-agent.md
  - About: about.md

not_in_nav: |
  Logging/loki.md
  AgenticAI/kagent.md
  AgenticAI/agent-gateway.md
  assets/keycloak-kong.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo.png
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: DM Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline

extra_css:
  - assets/stylesheets/custom.css

extra:
  homepage: https://blog.umeshkhatiwada.com.np
  social:
    - icon: fontawesome/solid/house
      link: https://umeshkhatiwada.com.np
      name: Portfolio
    - icon: fontawesome/brands/github
      link: https://github.com/umesh-khatiwada
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/umesh-khatiwada/
      name: LinkedIn
    - icon: fontawesome/brands/medium
      link: https://medium.com/@contact.khatiwada
      name: Medium
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/The_khatiwada
      name: X
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        assets/Docker-Image-Security.md: Platform/docker-image-security.md
        assets/keda.md: Platform/keda.md
  - awesome-pages
  - git-revision-date-localized:
      fallback_to_build_date: true
  - rss
